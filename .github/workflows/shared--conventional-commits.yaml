name: shared / conventional commits

on:
  workflow_call:
    inputs:
      payload:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: openpolicyagent/conftest:v0.70.0@sha256:1d5b939a6310fbc18a66165f436f763c57a568822bfe449cb0b9d89a70a0334b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Write Conventional Commits input
        shell: sh
        env:
          CONVENTIONAL_COMMITS_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -eu
          printf '%s\n' "${CONVENTIONAL_COMMITS_PAYLOAD}" > conventional-commits.json
      - name: Validate Conventional Commits syntax
        run: conftest test -o github -p conftest/conventional-commits conventional-commits.json
